
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Monitor Research Scoring</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            text-align: center;
            color: white;
            font-family: sans-serif;
        }

        video {
            display: none;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            -webkit-transform: scaleX(-1);
            transform: scaleX(-1);
        }

        #status-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 12px;
            z-index: 10;
            width: 80%;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div id="status-box">กำลังเริ่มระบบประเมินความเสี่ยง...</div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBox = document.getElementById('status-box');

        let drowsyScore = 0;
        let lastSentAlert = "";

        // เก็บเหตุการณ์ล่าสุดที่ตรวจพบ
        let lastDetectedEvent = "ยังไม่พบเหตุการณ์ผิดปกติ";

        // ตัวแปรจับเวลาความต่อเนื่อง
        let eyeClosedCounter = 0;
        let yawnCounter = 0;
        let headDownCounter = 0;

        // ส่งข้อมูลไปยัง MIT App Inventor
        // รูปแบบ: ระดับความเสี่ยง,คะแนน,เหตุการณ์
        function updateApp(riskLevel, score, detectedEvent) {
            const dataString =
                riskLevel + "," + score + "," + detectedEvent;

            if (dataString !== lastSentAlert) {
                lastSentAlert = dataString;

                if (window.AppInventor &&
                    window.AppInventor.setWebViewString) {

                    window.AppInventor.setWebViewString(dataString);
                }
            }
        }

        function onResults(results) {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;

            canvasCtx.save();
            canvasCtx.clearRect(
                0, 0,
                canvasElement.width,
                canvasElement.height
            );

            canvasCtx.drawImage(
                results.image,
                0, 0,
                canvasElement.width,
                canvasElement.height
            );

            if (results.multiFaceLandmarks &&
                results.multiFaceLandmarks.length > 0) {

                const landmarks = results.multiFaceLandmarks[0];

                // คำนวณระยะตา (Eye_Closed)
                const leftEyeTop = landmarks[159];
                const leftEyeBottom = landmarks[145];
                const rightEyeTop = landmarks[386];
                const rightEyeBottom = landmarks[374];

                const leftEyeDist = Math.hypot(
                    leftEyeTop.x - leftEyeBottom.x,
                    leftEyeTop.y - leftEyeBottom.y
                );

                const rightEyeDist = Math.hypot(
                    rightEyeTop.x - rightEyeBottom.x,
                    rightEyeTop.y - rightEyeBottom.y
                );

                const avgEyeDist =
                    (leftEyeDist + rightEyeDist) / 2;

                // คำนวณระยะปาก (Yawning)
                const lipTop = landmarks[13];
                const lipBottom = landmarks[14];

                const mouthDist = Math.hypot(
                    lipTop.x - lipBottom.x,
                    lipTop.y - lipBottom.y
                );

                // ตรวจสอบการก้มหน้า (Head_Down)
                const noseTip = landmarks[1];
                const isHeadDown = noseTip.y > 0.65;

                // 1. หลับตาต่อเนื่องเกิน 3 วินาที (+40%)
                if (avgEyeDist < 0.010) {
                    eyeClosedCounter++;

                    if (eyeClosedCounter >= 30) {
                        drowsyScore += 40;
                        eyeClosedCounter = 0;

                        lastDetectedEvent = "หลับตา";
                    }
                } else {
                    eyeClosedCounter = 0;
                }

                // 2. หาวต่อเนื่องเกิน 3 วินาที (+20%)
                if (mouthDist > 0.08) {
                    yawnCounter++;

                    if (yawnCounter >= 30) {
                        drowsyScore += 20;
                        yawnCounter = 0;

                        lastDetectedEvent = "กำลังหาว";
                    }
                } else {
                    yawnCounter = 0;
                }

                // 3. ก้มหน้าต่อเนื่อง (+20%)
                if (isHeadDown) {
                    headDownCounter++;

                    if (headDownCounter >= 30) {
                        drowsyScore += 20;
                        headDownCounter = 0;

                        lastDetectedEvent = "กำลังก้มหน้า";
                    }
                } else {
                    headDownCounter = 0;
                }

                // ค่อยๆ ลดคะแนนเมื่อขับขี่ปกติ
                if (avgEyeDist >= 0.010 &&
                    mouthDist <= 0.08 &&
                    !isHeadDown) {

                    if (drowsyScore > 0) {
                        drowsyScore -= 1;
                    }
                }

                // จำกัดคะแนนสูงสุด 100 และต่ำสุด 0
                if (drowsyScore > 100) {
                    drowsyScore = 100;
                }

                if (drowsyScore < 0) {
                    drowsyScore = 0;
                }

                // ประเมินระดับความเสี่ยง
                // LOW = 0–49
                // MEDIUM = 50–79
                // HIGH = 80–100

                let riskLevel = "";
                let statusText = "";
                let backgroundColor = "";

                if (drowsyScore >= 80) {
                    riskLevel = "HIGH";
                    statusText = "🚨 HIGH: อันตราย! (วิกฤต)";
                    backgroundColor = "rgba(255, 0, 0, 0.85)";

                } else if (drowsyScore >= 50) {
                    riskLevel = "MEDIUM";
                    statusText = "⚠️ MEDIUM: เสี่ยงปานกลาง (เริ่มล้า)";
                    backgroundColor = "rgba(255, 140, 0, 0.85)";

                } else {
                    riskLevel = "LOW";
                    statusText = "✅ LOW: ปกติ / ปลอดภัย";
                    backgroundColor = "rgba(0, 128, 0, 0.85)";
                }

                // แสดงระดับ คะแนน และเหตุการณ์ล่าสุด
                statusBox.style.background = backgroundColor;

                statusBox.innerHTML =
                    statusText +
                    "<br><small>คะแนนความเสี่ยง: " +
                    drowsyScore +
                    "%</small>" +
                    "<br><small>เหตุการณ์ล่าสุด: " +
                    lastDetectedEvent +
                    "</small>";

                // ส่งระดับ คะแนน และเหตุการณ์ไปยังแอป
                updateApp(
                    riskLevel,
                    drowsyScore,
                    lastDetectedEvent
                );

            } else {
                // กรณีไม่พบใบหน้า
                statusBox.style.background =
                    "rgba(100, 100, 100, 0.85)";

                statusBox.innerHTML =
                    "❌ ไม่พบใบหน้าผู้ขับขี่";

                updateApp("LOW", 0, "ไม่พบใบหน้า");
            }

            canvasCtx.restore();
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start();
    </script>
</body>
</html>
