<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Monitor - Drowsiness Detection</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #container {
            margin-top: 20px;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 3px solid #3b82f6;
        }
        .btn-start {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-start:active {
            background-color: #16a34a;
        }
        #status {
            margin-top: 15px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h2>Camera Detection</h2>
    <div id="status">กำลังเริ่มระบบประเมินความเสี่ยง...</div>

    <div id="container">
        <!-- ปุ่มกดเปิดกล้องเพื่อให้ผู้ใช้กดเอง (แก้ปัญหา Permission Denied บนแอป) -->
        <button id="startBtn" class="btn-start" onclick="startCamera()">📷 คลิกเพื่อเริ่มเปิดกล้อง</button>
        
        <br><br>
        <!-- แท็กวิดีโอสำหรับแสดงภาพจากกล้อง -->
        <video id="webcam" autoplay playsinline muted style="display: none;"></video>
    </div>

    <script>
        async function startCamera() {
            const videoElement = document.getElementById('webcam');
            const statusElement = document.getElementById('status');
            const startButton = document.getElementById('startBtn');

            try {
                statusElement.innerText = "กำลังขอสิทธิ์เข้าถึงกล้อง...";
                
                // ขออนุญาตใช้กล้องหน้า
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });

                videoElement.srcObject = stream;
                videoElement.style.display = "block";
                startButton.style.display = "none"; // ซ่อนปุ่มเมื่อเปิดกล้องสำเร็จ
                statusElement.innerText = "ระบบกล้องทำงานปกติ กำลังประเมินความง่วง...";

                // ตัวอย่างการส่งค่าระดับความเสี่ยงกลับไปที่ App Inventor (ผ่าน CustomWebView)
                // รูปแบบ: "ระดับความเสี่ยง,ข้อความเพิ่มเติม"
                if (window.Vuplex && window.Vuplex.WebView) {
                    window.Vuplex.WebView.postMessage("NORMAL,0");
                } else if (window.CustomWebView) {
                    window.CustomWebView.setWebViewString("NORMAL,0");
                }

            } catch (error) {
                console.error("Camera Error:", error);
                statusElement.innerText = "ไม่สามารถเปิดกล้องได้: " + error.message;
                alert("Failed to acquire camera feed: " + error.message);
            }
        }
    </script>

</body>
</html>
