<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Monitor Detection</title>
    <!-- โหลดไลบรารี MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background: #000; text-align: center; color: white; font-family: sans-serif; }
        video { display: none; } /* ซ่อนวิดีโอดิบ แสดงผลแค่ Canvas */
        canvas { width: 100vw; height: 100vh; object-fit: cover; }
        #status { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
                  background: rgba(0,0,0,0.7); padding: 10px 20px; font-size: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="status">กำลังโหลดระบบตรวจจับ...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusDiv = document.getElementById('status');

        let lastState = "";

        function sendToApp(stateText) {
            if (stateText !== lastState) {
                lastState = stateText;
                statusDiv.innerText = "สถานะ: " + stateText;
                // คำสั่งส่งค่ากลับไปหา MIT App Inventor ผ่าน WebViewer
                if (window.AppInventor && window.AppInventor.setWebViewString) {
                    window.AppInventor.setWebViewString(stateText);
                }
            }
        }

        function onResults(results) {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // จุดสำคัญของตาบน-ล่าง (ตัวอย่างพิกัด MediaPipe สำหรับคำนวณความเปิดของตา)
                // ตาซ้ายบน: 159, ล่าง: 145 / ตาขวาบน: 386, ล่าง: 374
                const leftEyeTop = landmarks[159];
                const leftEyeBottom = landmarks[145];
                const rightEyeTop = landmarks[386];
                const rightEyeBottom = landmarks[374];

                // คำนวณระยะห่างเปลือกตา (EAR - Eye Aspect Ratio คร่าวๆ)
                const leftEyeDist = Math.hypot(leftEyeTop.x - leftEyeBottom.x, leftEyeTop.y - leftEyeBottom.y);
                const rightEyeDist = Math.hypot(rightEyeTop.x - rightEyeBottom.y, rightEyeTop.y - rightEyeBottom.y);
                const avgEyeDist = (leftEyeDist + rightEyeDist) / 2;

                // จุดปากบน-ล่าง สำหรับเช็คการหาว (ริมฝีปากบน: 13, ล่าง: 14)
                const lipTop = landmarks[13];
                const lipBottom = landmarks[14];
                const mouthDist = Math.hypot(lipTop.x - lipBottom.x, lipTop.y - lipBottom.y);

                // กำหนดเงื่อนไข (Threshold สามารถปรับตัวเลขเพดานความกว้าง/แคบได้ตามจริง)
                if (avgEyeDist < 0.022) {
                    sendToApp("Eye_Closed (ตาปิด/ง่วง)");
                    statusDiv.style.background = "rgba(255,0,0,0.8)";
                } else if (mouthDist > 0.08) {
                    sendToApp("Yawning (กำลังหาว)");
                    statusDiv.style.background = "rgba(255,165,0,0.8)";
                } else {
                    sendToApp("Eye_Open (ปกติ)");
                    statusDiv.style.background = "rgba(0,128,0,0.8)";
                }
            } else {
                sendToApp("No Face (ไม่พบใบหน้า)");
                statusDiv.style.background = "rgba(100,100,100,0.8)";
            }
            canvasCtx.restore();
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
